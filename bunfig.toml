[test]
root = "test"
timeout = 10000
preload = ["./test/preload.js"]
pathIgnorePatterns = ["**/helpers/**", "**/typescript/**"]
coverageSkipTestFiles = true
coverageThreshold = { lines = 0.95, functions = 0.95 }
coveragePathIgnorePatterns = ["**/Descriptor.ts", "**/*.d.ts", "**/test/**", "**/plugins/**", "**/node_modules/**", "**/main.cts"]
